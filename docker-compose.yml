services:
  db:
    image: postgres:16
    container_name: flight_db
    environment:
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
      POSTGRES_DB: flights
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - flight_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: flight_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - flight_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

networks:
  flight_network:
    driver: bridge

volumes:
  pgdata:
  pgadmin_data:
